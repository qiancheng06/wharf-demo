# 数字码头 - 一级全局检测模型配置
# YOLOv8s - 检测: person, container, fire_region, obstacle

# 数据集路径
path: ./data/global_dataset  # 数据集根目录
train: images/train  # 训练集图像
val: images/val  # 验证集图像
test: images/test  # 测试集图像（可选）

# 类别定义
names:
  0: person
  1: container
  2: fire_region
  3: obstacle

# 训练参数
epochs: 80
imgsz: 640
batch: 16

# 模型选择
model: yolov8s.pt

# 数据增强
hsv_h: 0.015  # HSV色调增强
hsv_s: 0.7    # HSV饱和度增强
hsv_v: 0.4    # HSV亮度增强
degrees: 0.0  # 旋转角度
translate: 0.1  # 平移
scale: 0.5    # 缩放
shear: 0.0    # 剪切
perspective: 0.0  # 透视
flipud: 0.0   # 上下翻转
fliplr: 0.5   # 左右翻转
mosaic: 1.0   # Mosaic增强
mixup: 0.0    # Mixup增强
copy_paste: 0.0  # Copy-paste增强

# 优化器
optimizer: SGD
lr0: 0.01     # 初始学习率
lrf: 0.01     # 最终学习率
momentum: 0.937
weight_decay: 0.0005

# 其他设置
patience: 50  # 早停耐心值
save: True    # 保存检查点
save_period: 10  # 每10轮保存
cache: False  # 是否缓存图像

# 设备
device: auto  # auto, cpu, cuda:0

# 工作线程
workers: 8
